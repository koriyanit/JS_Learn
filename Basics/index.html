```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Email & Password Validator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #222;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 350px;
            padding: 30px;

            background-color: #333;
            border-radius: 10px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        h2 {
            margin-bottom: 25px;
            text-align: center;
            color: white;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            color: white;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 11px;

            border: 1px solid #555;
            border-radius: 5px;

            background-color: #222;
            color: white;

            outline: none;
        }

        input:focus {
            border-color: #777;
        }

        input::placeholder {
            color: #888;
        }

        .error {
            display: none;

            margin-top: 6px;

            color: #ff6b6b;
            font-size: 12px;
        }

        .success {
            display: none;

            margin-top: 6px;

            color: #4ade80;
            font-size: 12px;
        }

        button {
            width: 100%;
            padding: 11px;

            border: none;
            border-radius: 5px;

            background-color: #d00000;
            color: white;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background-color: #e00000;
        }

        #result {
            color: #d00000;
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Email & Password Validator</h2>

        <form id="validatorForm">

            <!-- Email -->
            <div class="form-group">

                <label for="email">Email</label>

                <input
                    id="email"
                    type="text"
                    placeholder="Enter your email"
                >

                <small id="emailError" class="error">
                    Please enter a valid email address.
                </small>

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">Password</label>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                >

                <small id="passwordError" class="error">
                    Password does not meet the requirements.
                </small>

            </div>


            <!-- Submit -->
            <button type="submit">
                Validate
            </button>

            <div id="result"></div>

        </form>

    </div>


    <script src="validator.js"></script>

</body>

</html>
```
